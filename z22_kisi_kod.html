 <textarea cols="90" rows="24">
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styl.css">
</head>
<body>
<script type="text/javascript">
  function Pole_kis(a_kis, b_kis) {
    return a_kis * b_kis;
  }
  function obwod_kis(a_kis, b_kis) {
    return 2 * (a_kis + b_kis);
  }
  function pole() {
    var a_kis = parseFloat(document.getElementById('a_dana_kis').value);
    var b_kis = parseFloat(document.getElementById('b_dana_kis').value);
    var pole = Pole_kis(a_kis, b_kis);
    document.getElementById("nazwa").innerHTML = "Pole prostokąta = " + pole.toFixed(2) + " cm²";
    document.getElementById('wyprowadz_pole_kis').value = pole.toFixed(2);
  }
  function obwod() {
    var a_kis = parseFloat(document.getElementById('a_dana_kis').value);
    var b_kis = parseFloat(document.getElementById('b_dana_kis').value);
    var obw = obwod_kis(a_kis, b_kis);
    document.getElementById("nazwa").innerHTML = "Obwód prostokąta = " + obw.toFixed(2) + " cm";
    document.getElementById('wyprowadz_obwod_kis').value = obw.toFixed(2);
  }
</script>
  <h1>Wszystko o PROSTOKĄCIE</h1><br><br>
  Podaj długość boku a: <input type="text" id="a_dana_kis" value=""> cm<br><br>
  Podaj długość boku b: <input type="text" id="b_dana_kis" value=""> cm<br><br>
  <input type="button" name="pole" value="Oblicz pole" onclick="pole()"><br><br>
  <input type="button" name="obw" value="Oblicz obwód" onclick="obwod()"><br><br>
  <div style="color:red;font-size:50px;" id="nazwa"></div>
  <br>
</body>
</html>
</textarea>
 </body>
</html>

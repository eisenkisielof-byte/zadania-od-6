<html> 
     <head> 
           <script type="text/javascript"> 
                 var pociąg = { 
   ile wagonów: '7', 
   ile miejsc w wagonie: '9', 
   ile miejsc w sumie: '63', 
   pokaz: function () 
     { 
        document.write(this.ile wagonów + ' ' + this.ile miejsc w wagonie) 
     } 
  } 
  pociąg.pokaz(); 
            </script> 
     </head> 
<body>

   Programowanie obiektowe. <br> 
     Obiekt  to  pociąg<br>

     ile wagonów<br> 
     ile miejsc w wagonie<br> 
     ile miejsc w sumie<br> 
     metoda:  pokaz<br> 
</body> 
</html>
